name: Build Kernel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          sudo apt-get autoremove -y

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            flex bison \
            build-essential \
            gcc-aarch64-linux-gnu \
            libelf-dev \
            libssl-dev \
            libdw-dev \
            cmake \
            cpio \
            git \
            clang \
            lld \
            llvm

      - name: Get kernel source
        uses: actions/checkout@v4
        with:
          repository: ikun-1145141/android_kernel_xiaomi_sm8350_star
          ref: main
          path: kernel
          fetch-depth: 1

      - name: Fetch device kernel config
        run: |
          cd kernel
          curl -fsSL -o kernel.config https://raw.githubusercontent.com/xinyu-candy/android_kernel_xiaomi_sm8350_star/venus-5.10bpf/kernel.config

      - name: Validate kernel.config
        run: |
          cd kernel
          echo "=== Line count ==="
          wc -l kernel.config
          echo "=== Last 10 lines ==="
          tail -10 kernel.config
          echo "=== File size ==="
          ls -lh kernel.config

      - name: Apply config and enable BTF with LLVM
        run: |
          cd kernel
          cp kernel.config .config
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          
          # 开启 BTF
          ./scripts/config -e CONFIG_DEBUG_INFO
          ./scripts/config -e CONFIG_DEBUG_INFO_DWARF4
          ./scripts/config -e CONFIG_DEBUG_INFO_BTF
          ./scripts/config -e CONFIG_DEBUG_INFO_REDUCED
          ./scripts/config -d CONFIG_DEBUG_INFO_SPLIT
          
          # 关键：强制用 LLVM 工具链生成 BTF，而非 pahole
          ./scripts/config -e CONFIG_PAHOLE_HAS_SPLIT_BTF
          ./scripts/config -e CONFIG_PAHOLE_HAS_BTF_TAG
          ./scripts/config -e CONFIG_DEBUG_INFO_BTF_MODULES
          
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: Verify config
        run: |
          cd kernel
          grep -E 'CONFIG_DEBUG_INFO|CONFIG_DEBUG_INFO_BTF|CONFIG_PAHOLE' .config

      - name: Build kernel with LLVM
        run: |
          cd kernel
          export LLVM=1
          export LLVM_IAS=1
          make -j$(nproc) \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 \
            LLVM_IAS=1 \
            Image dtbs

      - name: Build modules with LLVM
        run: |
          cd kernel
          export LLVM=1
          export LLVM_IAS=1
          make -j$(nproc) \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 \
            LLVM_IAS=1 \
            modules

      - name: Verify output
        run: |
          cd kernel
          echo "=== vmlinux ==="
          ls -lh vmlinux
          file vmlinux
          echo ""
          echo "=== BTF check ==="
          bpftool btf dump file vmlinux format raw 2>/dev/null | head -5 || echo "Checking with readelf..."
          readelf -S vmlinux 2>/dev/null | grep -i btf || echo "BTF section not found via readelf"
          echo ""
          echo "=== Image ==="
          ls -lh arch/arm64/boot/Image
          echo ""
          echo "=== DTB ==="
          find arch/arm64/boot/dts -name "*.dtb" | head -20

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-output
          path: |
            kernel/arch/arm64/boot/Image
            kernel/arch/arm64/boot/dts/**/*.dtb
            kernel/vmlinux
          retention-days: 7
