name: Build Kernel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            flex bison build-essential gcc-aarch64-linux-gnu \
            libelf-dev libssl-dev libdw-dev cpio git curl \
            ca-certificates python3 pkg-config zlib1g-dev \
            binutils-aarch64-linux-gnu cmake

      - name: Setup swap (6GB)
        run: |
          sudo fallocate -l 6G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Build pahole from source
        run: |
          sudo apt-get remove -y pahole dwarves 2>/dev/null; true
          git clone --depth=1 https://git.kernel.org/pub/scm/devel/pahole/pahole.git
          cd pahole
          mkdir build && cd build
          cmake -DCMAKE_INSTALL_PREFIX=/usr ..
          make -j$(nproc)
          sudo make install
          sudo ldconfig
          which pahole
          pahole --version

      - name: Clone kernel source
        run: |
          git clone --depth=1 -b main https://github.com/ikun-1145141/android_kernel_xiaomi_sm8350_star.git kernel

      - name: Fetch config
        run: |
          cd kernel
          curl -fsSL -o kernel.config https://raw.githubusercontent.com/xinyu-candy/android_kernel_xiaomi_sm8350_star/venus-5.10bpf/kernel.config

      - name: Configure kernel
        run: |
          cd kernel
          cp kernel.config .config
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

          # 关 BTF，编译阶段不生成 BTF
          scripts/config -d CONFIG_DEBUG_INFO_BTF

          # 用 DWARF5（对交叉编译更友好）
          scripts/config -d CONFIG_DEBUG_INFO_DWARF4
          scripts/config -e CONFIG_DEBUG_INFO_DWARF5

          scripts/config -e CONFIG_DEBUG_INFO
          scripts/config -d CONFIG_DEBUG_INFO_REDUCED
          scripts/config -d CONFIG_DEBUG_INFO_SPLIT
          scripts/config -d CONFIG_DEBUG_INFO_COMPRESSED
          scripts/config -d CONFIG_FTRACE
          scripts/config -d CONFIG_FUNCTION_TRACER
          scripts/config -d CONFIG_VENDOR_QTI_KERNEL 2>/dev/null; true
          scripts/config -d CONFIG_VENDOR_QCOM_KERNEL 2>/dev/null; true
          scripts/config -d CONFIG_VENDOR_XIAOMI_KERNEL 2>/dev/null; true

          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

          echo "=== Final BTF config ==="
          grep -E "CONFIG_DEBUG_INFO|CONFIG_DEBUG_INFO_BTF|CONFIG_DEBUG_INFO_DWARF" .config

      - name: Build kernel
        run: |
          cd kernel
          export CROSS_COMPILE=aarch64-linux-gnu-
          export ARCH=arm64
          make -j$(nproc) Image dtbs vmlinux 2>&1 | tail -300

      - name: Generate BTF from vmlinux
        run: |
          cd kernel
          echo "=== pahole version ==="
          pahole --version
          echo "=== Extracting BTF ==="
          pahole --btf_encode_detached vmlinux.btf vmlinux 2>&1 || {
            echo "BTF encode failed, trying with --force..."
            pahole --btf_encode_detached --force vmlinux.btf vmlinux 2>&1
          }
          ls -lh vmlinux.btf 2>/dev/null && echo "BTF OK!" || echo "BTF failed, continuing..."

      - name: Verify
        run: |
          cd kernel
          echo "=== Image ===" && ls -lh arch/arm64/boot/Image
          echo "=== vmlinux ===" && ls -lh vmlinux
          echo "=== vmlinux.btf ===" && ls -lh vmlinux.btf 2>/dev/null || echo "No BTF file"

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: kernel/arch/arm64/boot/Image
          retention-days: 7

      - name: Upload vmlinux
        uses: actions/upload-artifact@v4
        with:
          name: kernel-vmlinux
          path: kernel/vmlinux
          retention-days: 7

      - name: Upload BTF
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: kernel-btf
          path: kernel/vmlinux.btf
          retention-days: 7

      - name: Upload DTBs
        uses: actions/upload-artifact@v4
        with:
          name: kernel-dtbs
          path: kernel/arch/arm64/boot/dts/**/*.dtb
          retention-days: 7
