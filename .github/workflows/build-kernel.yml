name: Build Kernel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          sudo apt-get autoremove -y

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            flex bison \
            build-essential \
            gcc-aarch64-linux-gnu \
            libelf-dev \
            libssl-dev \
            libdw-dev \
            cmake \
            cpio \
            git

      - name: Build pahole v1.22 (compatible with 5.4 kernel)
        run: |
          sudo apt-get remove -y dwarves || true
          
          git clone -b v1.22 --depth=1 https://github.com/acmel/dwarves.git /tmp/dwarves
          cd /tmp/dwarves
          mkdir build && cd build
          cmake -DCMAKE_INSTALL_PREFIX=/usr/local ..
          make -j$(nproc)
          sudo make install
          
          export PATH=/usr/local/bin:$PATH
          echo 'export PATH=/usr/local/bin:$PATH' >> $GITHUB_ENV
          
          pahole --version

      - name: Get kernel source
        uses: actions/checkout@v4
        with:
          repository: ikun-1145141/android_kernel_xiaomi_sm8350_star
          ref: main
          path: kernel
          fetch-depth: 1

      - name: Fetch device kernel config
        run: |
          cd kernel
          curl -fsSL -o kernel.config https://raw.githubusercontent.com/xinyu-candy/android_kernel_xiaomi_sm8350_star/venus-5.10bpf/kernel.config

      - name: Validate kernel.config
        run: |
          cd kernel
          echo "=== Line count ==="
          wc -l kernel.config
          echo "=== Last 10 lines ==="
          tail -10 kernel.config
          echo "=== File size ==="
          ls -lh kernel.config

      - name: Apply config and enable BTF (minimal for 5.4)
        run: |
          cd kernel
          cp kernel.config .config
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          
          # 只开核心 BTF 选项
          ./scripts/config -e CONFIG_DEBUG_INFO
          ./scripts/config -e CONFIG_DEBUG_INFO_DWARF4
          ./scripts/config -e CONFIG_DEBUG_INFO_BTF
          
          # 显式关闭可能不兼容的选项
          ./scripts/config -d CONFIG_DEBUG_INFO_REDUCED
          ./scripts/config -d CONFIG_DEBUG_INFO_SPLIT
          ./scripts/config -d CONFIG_DEBUG_INFO_COMPRESSED
          ./scripts/config -d CONFIG_DEBUG_INFO_BTF_MODULES
          
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: Verify pahole and BTF config
        run: |
          echo "=== pahole version ==="
          pahole --version
          echo "=== pahole path ==="
          which pahole
          echo "=== BTF settings ==="
          cd kernel
          grep -E 'CONFIG_DEBUG_INFO|CONFIG_DEBUG_INFO_BTF' .config

      - name: Build kernel
        run: |
          cd kernel
          export PATH=/usr/local/bin:$PATH
          make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- Image dtbs 2>&1 | tee build.log

      - name: Build modules
        run: |
          cd kernel
          export PATH=/usr/local/bin:$PATH
          make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules 2>&1 | tee modules.log

      - name: Verify BTF in vmlinux
        run: |
          cd kernel
          echo "=== vmlinux ==="
          ls -lh vmlinux
          echo ""
          echo "=== Looking for .BTF section ==="
          readelf -S vmlinux | grep -i btf || echo "BTF section not found, checking build log..."
          echo ""
          echo "=== Build log last 50 lines ==="
          tail -50 build.log

      - name: Verify output
        run: |
          cd kernel
          echo "=== vmlinux ==="
          ls -lh vmlinux
          echo "=== Image ==="
          ls -lh arch/arm64/boot/Image
          echo "=== DTB ==="
          find arch/arm64/boot/dts -name "*.dtb" | head -20

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-output
          path: |
            kernel/arch/arm64/boot/Image
            kernel/arch/arm64/boot/dts/**/*.dtb
            kernel/vmlinux
          retention-days: 7
