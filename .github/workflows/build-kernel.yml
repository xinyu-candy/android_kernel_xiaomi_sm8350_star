name: Build Kernel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            flex bison build-essential gcc-aarch64-linux-gnu \
            libelf-dev libssl-dev libdw-dev cpio git curl \
            ca-certificates python3 pkg-config zlib1g-dev \
            binutils-aarch64-linux-gnu \
            pahole

      - name: Clone kernel source
        run: |
          git clone --depth=1 -b main https://github.com/ikun-1145141/android_kernel_xiaomi_sm8350_star.git kernel

      - name: Fetch config
        run: |
          cd kernel
          curl -fsSL -o kernel.config https://raw.githubusercontent.com/xinyu-candy/android_kernel_xiaomi_sm8350_star/venus-5.10bpf/kernel.config

      - name: Configure kernel
        run: |
          cd kernel
          cp kernel.config .config
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

          ./scripts/config -d CONFIG_VENDOR_QTI_KERNEL
          ./scripts/config -d CONFIG_VENDOR_QCOM_KERNEL
          ./scripts/config -d CONFIG_VENDOR_XIAOMI_KERNEL

          ./scripts/config -e CONFIG_DEBUG_INFO
          ./scripts/config -e CONFIG_DEBUG_INFO_DWARF4
          ./scripts/config -e CONFIG_DEBUG_INFO_BTF
          ./scripts/config -d CONFIG_DEBUG_INFO_REDUCED
          ./scripts/config -d CONFIG_DEBUG_INFO_SPLIT
          ./scripts/config -d CONFIG_DEBUG_INFO_COMPRESSED
          ./scripts/config -d CONFIG_FTRACE
          ./scripts/config -d CONFIG_FUNCTION_TRACER

          # 🔑 修触屏驱动 bug
          ./scripts/config -e CONFIG_TOUCHSCREEN_XIAOMI_SDM870_TOUCH_UPGRADE_FIRMWARE

          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: Build kernel
        run: |
          cd kernel
          export CROSS_COMPILE=aarch64-linux-gnu-
          export ARCH=arm64
          make -j$(nproc) Image dtbs 2>&1 | tail -300

      - name: Verify output
        run: |
          cd kernel
          ls -lh arch/arm64/boot/Image
          ls -lh vmlinux
          file vmlinux

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: kernel/arch/arm64/boot/Image
          retention-days: 7

      - name: Upload vmlinux
        uses: actions/upload-artifact@v4
        with:
          name: kernel-vmlinux
          path: kernel/vmlinux
          retention-days: 7

      - name: Upload DTBs
        uses: actions/upload-artifact@v4
        with:
          name: kernel-dtbs
          path: kernel/arch/arm64/boot/dts/**/*.dtb
          retention-days: 7
