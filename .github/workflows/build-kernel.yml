name: Build Kernel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ubuntu:22.04

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            flex bison \
            build-essential \
            gcc-aarch64-linux-gnu \
            libelf-dev \
            libssl-dev \
            libdw-dev \
            cpio \
            git \
            curl \
            ca-certificates \
            python3 \
            pkg-config \
            zlib1g-dev \
            binutils-aarch64-linux-gnu \
            cmake

      - name: Build pahole v1.20
        run: |
          git clone -b v1.20 --depth=1 https://github.com/acmel/dwarves.git /tmp/dwarves
          cd /tmp/dwarves
          mkdir build && cd build
          cmake -DCMAKE_INSTALL_PREFIX=/usr/local ..
          make -j$(nproc)
          make install
          ldconfig
          /usr/local/bin/pahole --version

      - name: Clone kernel source
        run: |
          git clone --depth=1 -b main https://github.com/ikun-1145141/android_kernel_xiaomi_sm8350_star.git kernel

      - name: Fetch device kernel config
        run: |
          cd kernel
          curl -fsSL -o kernel.config https://raw.githubusercontent.com/xinyu-candy/android_kernel_xiaomi_sm8350_star/venus-5.10bpf/kernel.config

      - name: Apply config and enable BTF
        run: |
          cd kernel
          cp kernel.config .config
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          
          ./scripts/config -e CONFIG_DEBUG_INFO
          ./scripts/config -e CONFIG_DEBUG_INFO_DWARF4
          ./scripts/config -e CONFIG_DEBUG_INFO_BTF
          ./scripts/config -d CONFIG_DEBUG_INFO_REDUCED
          ./scripts/config -d CONFIG_DEBUG_INFO_SPLIT
          ./scripts/config -d CONFIG_DEBUG_INFO_COMPRESSED
          
          ./scripts/config -d CONFIG_FTRACE
          ./scripts/config -d CONFIG_FUNCTION_TRACER
          
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: Verify pahole and config
        run: |
          echo "=== pahole ==="
          /usr/local/bin/pahole --version
          echo "=== GCC ==="
          aarch64-linux-gnu-gcc --version | head -1
          echo "=== BTF config ==="
          cd kernel
          grep -E 'CONFIG_DEBUG_INFO|CONFIG_DEBUG_INFO_BTF|CONFIG_FTRACE|CONFIG_FUNCTION_TRACER' .config

      - name: Build kernel (compile only, no link)
        run: |
          cd kernel
          export CC=aarch64-linux-gnu-gcc
          export LD=aarch64-linux-gnu-ld
          export AR=aarch64-linux-gnu-ar
          export NM=aarch64-linux-gnu-nm
          export OBJCOPY=aarch64-linux-gnu-objcopy
          export OBJDUMP=aarch64-linux-gnu-objdump
          export READELF=aarch64-linux-gnu-readelf
          export STRIP=aarch64-linux-gnu-strip
          export CROSS_COMPILE=aarch64-linux-gnu-
          export ARCH=arm64
          export PATH=/usr/local/bin:$PATH
          # split into two steps: compile first with fewer jobs
          make -j2 Image dtbs 2>&1 | tail -80

      - name: Build modules
        run: |
          cd kernel
          export CC=aarch64-linux-gnu-gcc
          export LD=aarch64-linux-gnu-ld
          export AR=aarch64-linux-gnu-ar
          export NM=aarch64-linux-gnu-nm
          export OBJCOPY=aarch64-linux-gnu-objcopy
          export OBJDUMP=aarch64-linux-gnu-objdump
          export READELF=aarch64-linux-gnu-readelf
          export STRIP=aarch64-linux-gnu-strip
          export CROSS_COMPILE=aarch64-linux-gnu-
          export ARCH=arm64
          export PATH=/usr/local/bin:$PATH
          make -j2 modules 2>&1 | tail -50

      - name: Verify BTF in vmlinux
        run: |
          cd kernel
          ls -lh vmlinux
          echo ""
          echo "=== BTF section check ==="
          readelf -S vmlinux | grep -E '\.BTF|btf' || echo "No BTF found"

      - name: Verify output
        run: |
          cd kernel
          echo "=== vmlinux ==="
          ls -lh vmlinux
          echo "=== Image ==="
          ls -lh arch/arm64/boot/Image
          echo "=== DTB ==="
          find arch/arm64/boot/dts -name "*.dtb" | head -20

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-output
          path: |
            kernel/arch/arm64/boot/Image
            kernel/arch/arm64/boot/dts/**/*.dtb
            kernel/vmlinux
          retention-days: 7
