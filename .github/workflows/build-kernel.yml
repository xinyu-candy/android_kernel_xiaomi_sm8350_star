name: Build Kernel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          sudo apt-get autoremove -y

      - name: Install all dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            flex bison \
            build-essential \
            gcc-aarch64-linux-gnu \
            libelf-dev \
            libssl-dev \
            libdw-dev \
            cmake \
            cpio \
            dwarves

      - name: Install latest pahole from source
        run: |
          git clone --depth=1 https://git.kernel.org/pub/scm/devel/pahole/pahole.git /tmp/pahole
          cd /tmp/pahole
          mkdir build && cd build
          cmake -DCMAKE_INSTALL_PREFIX=/usr ..
          make -j$(nproc)
          sudo make install
          pahole --version

      - name: Get kernel source
        uses: actions/checkout@v4
        with:
          repository: ikun-1145141/android_kernel_xiaomi_sm8350_star
          ref: main
          path: kernel
          fetch-depth: 1

      - name: Fetch device kernel config
        run: |
          cd kernel
          curl -fsSL -o kernel.config https://raw.githubusercontent.com/xinyu-candy/android_kernel_xiaomi_sm8350_star/venus-5.10bpf/kernel.config

      - name: Validate kernel.config
        run: |
          cd kernel
          echo "=== Line count ==="
          wc -l kernel.config
          echo "=== Last 10 lines ==="
          tail -10 kernel.config
          echo "=== File size ==="
          ls -lh kernel.config

      - name: Apply config and enable BTF
        run: |
          cd kernel
          cp kernel.config .config
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

          # 开启 BTF 相关
          ./scripts/config -e CONFIG_DEBUG_INFO
          ./scripts/config -e CONFIG_DEBUG_INFO_DWARF4
          ./scripts/config -e CONFIG_DEBUG_INFO_BTF
          ./scripts/config -e CONFIG_DEBUG_INFO_REDUCED
          ./scripts/config -d CONFIG_DEBUG_INFO_SPLIT

          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: Verify BTF config
        run: |
          cd kernel
          echo "=== BTF settings ==="
          grep -E 'CONFIG_DEBUG_INFO|CONFIG_DEBUG_INFO_BTF' .config

      - name: Build kernel
        run: |
          cd kernel
          make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- Image dtbs

      - name: Build modules
        run: |
          cd kernel
          make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules

      - name: Verify output
        run: |
          cd kernel
          echo "=== vmlinux ==="
          ls -lh vmlinux
          echo "=== Image ==="
          ls -lh arch/arm64/boot/Image
          echo "=== DTB ==="
          find arch/arm64/boot/dts -name "*.dtb" | head -20

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-output
          path: |
            kernel/arch/arm64/boot/Image
            kernel/arch/arm64/boot/dts/**/*.dtb
            kernel/vmlinux
          retention-days: 7
