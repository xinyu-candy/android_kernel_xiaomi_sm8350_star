name: Build Kernel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ubuntu:20.04

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            flex bison \
            build-essential \
            gcc-aarch64-linux-gnu \
            libelf-dev \
            libssl-dev \
            libdw-dev \
            cmake \
            cpio \
            git \
            curl \
            ca-certificates \
            python3 \
            pkg-config \
            zlib1g-dev

      - name: Build pahole v1.22
        run: |
          apt-get remove -y dwarves || true
          
          # 升级 CMake 到 3.16+（v1.22 需要）
          curl -fsSL -o /tmp/cmake.sh https://github.com/Kitware/CMake/releases/download/v3.16.9/cmake-3.16.9-Linux-x86_64.sh
          bash /tmp/cmake.sh --prefix=/usr/local --skip-license
          
          # 编译 pahole
          git clone -b v1.22 --depth=1 https://github.com/acmel/dwarves.git /tmp/dwarves
          cd /tmp/dwarves
          mkdir build && cd build
          cmake -DCMAKE_INSTALL_PREFIX=/usr/local ..
          make -j$(nproc)
          make install
          
          ldconfig
          pahole --version

      - name: Clone kernel source
        run: |
          git clone --depth=1 -b main https://github.com/ikun-1145141/android_kernel_xiaomi_sm8350_star.git kernel

      - name: Fetch device kernel config
        run: |
          cd kernel
          curl -fsSL -o kernel.config https://raw.githubusercontent.com/xinyu-candy/android_kernel_xiaomi_sm8350_star/venus-5.10bpf/kernel.config

      - name: Apply config and enable BTF
        run: |
          cd kernel
          cp kernel.config .config
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          
          ./scripts/config -e CONFIG_DEBUG_INFO
          ./scripts/config -e CONFIG_DEBUG_INFO_DWARF4
          ./scripts/config -e CONFIG_DEBUG_INFO_BTF
          ./scripts/config -d CONFIG_DEBUG_INFO_REDUCED
          ./scripts/config -d CONFIG_DEBUG_INFO_SPLIT
          ./scripts/config -d CONFIG_DEBUG_INFO_COMPRESSED
          
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: Verify pahole and config
        run: |
          pahole --version
          which pahole
          cd kernel
          grep -E 'CONFIG_DEBUG_INFO|CONFIG_DEBUG_INFO_BTF' .config

      - name: Build kernel (Image + dtbs)
        run: |
          cd kernel
          make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- Image dtbs

      - name: Build modules
        run: |
          cd kernel
          make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules

      - name: Verify BTF in vmlinux
        run: |
          cd kernel
          ls -lh vmlinux
          echo ""
          echo "=== BTF section check ==="
          readelf -S vmlinux | grep -E '\.BTF|btf' || echo "No BTF found, but kernel compiled successfully"

      - name: Verify output
        run: |
          cd kernel
          echo "=== vmlinux ==="
          ls -lh vmlinux
          echo "=== Image ==="
          ls -lh arch/arm64/boot/Image
          echo "=== DTB ==="
          find arch/arm64/boot/dts -name "*.dtb" | head -20

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-output
          path: |
            kernel/arch/arm64/boot/Image
            kernel/arch/arm64/boot/dts/**/*.dtb
            kernel/vmlinux
          retention-days: 7
