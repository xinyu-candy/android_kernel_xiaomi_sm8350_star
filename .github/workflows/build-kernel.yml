name: build-kernel-btf

on:
  workflow_dispatch:

env:
  CMDLINE: "cgroup_disable=pressure mitigations=off log_buf_len=256K rcupdate.rcu_expedited=1 rcu_nocbs=0-7 kpti=off console=ttyMSM0,115200n8 androidboot.hardware=qcom androidboot.console=ttyMSM0 androidboot.memcg=1 lpm_levels.sleep_disabled=1 video=vfb:640x400,bpp=32,memsize=3072000 msm_rtb.filter=0x237 service_locator.enable=1 androidboot.usbcontroller=a600000.dwc3 swiotlb=0 loop.max_part=7 cgroup.memory=nokmem,nosocket pcie_ports=compat loop.max_part=7 iptable_raw.raw_before_defrag=1 ip6table_raw.raw_before_defrag=1 buildvariant=user  androidboot.verifiedbootstate=orange androidboot.keymaster=1  androidboot.bootdevice=1d84000.ufshc androidboot.fstab_suffix=default androidboot.boot_devices=soc/1d84000.ufshc androidboot.serialno=39b42caa bootinfo.pureason=0x40001 bootinfo.pdreason=0x2 androidboot.hwversion=2.9.1 androidboot.cpuid=0x631e644f androidboot.hwc=CN androidboot.hwlevel=MP androidboot.camera.config=0 hwid.hwid_value=589825 hwid.project=2 hwid.build_adc=57210 hwid.project_adc=29293 androidboot.hardware.sku=star androidboot.product.hardware.sku=star androidboot.secureboot=1 androidboot.baseband=msm msm_drm.dsi_display0=qcom,mdss_dsi_k2_38_08_0a_mp_dsc_cmd: msm_drm.dsi_display1=qcom,mdss_dsi_k1_43_06_00_sec_video: androidboot.oled_wp=01f50bb40c4e msm_drm.oled_wp=01f50bb40c4e androidboot.oled_panel_id=K2_0A_MP androidboot.ufsid=0x198 androidboot.slot_suffix=_a rootwait ro init=/init androidboot.dtbo_idx=27 androidboot.dtb_idx=0 androidboot.ramdump=disable androidboot.force_normal_boot=1 block2mtd.block2mtd=/dev/block/sda15,2097152 mtdoops.mtddev=0 mtdoops.record_size=2097152 mtdoops.dump_oops=0 printk.always_kmsg_dump=1"
  KERNEL_BASE: "0x100000"
  PAGE_SIZE: "4096"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch full source
        run: |
          curl -fsSL -o k.zip "https://raw.githubusercontent.com/drfccv/android_kernel_xiaomi_sm8350_drfccv/main/anykernel3/kernel-5.4.302.zip"
          mkdir kernel
          unzip -q -o k.zip -d kernel
          TOP=$(find kernel -maxdepth 2 -name Makefile -type f | head -1)
          ROOT=$(dirname "$TOP")
          shopt -s dotglob
          mv "$ROOT"/* .
          head -5 Makefile

      - name: Fetch device config
        run: curl -fsSL -o kernel.config https://raw.githubusercontent.com/xinyu-candy/android_kernel_xiaomi_sm8350_star/venus-5.10bpf/kernel.config

      - name: Show kernel version
        run: head -5 Makefile

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y curl wget git build-essential gcc-aarch64-linux-gnu \
            flex bison libssl-dev libelf-dev bc squashfs-tools zstd xz-utils python3-dev

      - name: Configure with device config + BTF
        run: |
          aarch64-linux-gnu-gcc --version || sudo apt-get install -y gcc-aarch64-linux-gnu
          aarch64-linux-gnu-gcc --version
          cp kernel.config .config
          for c in CONFIG_DEBUG_INFO CONFIG_DEBUG_INFO_BTF; do
            grep -q "^${c}=" .config || sed -i "s|^# ${c} is not set|^${c}=y|" .config
          done
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: Build Image
        run: make -j"$(nproc)" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- Image

      - name: Verify BTF present
        run: |
          ls -l arch/arm64/boot/Image
          if command -v readelf >/dev/null 2>&1; then
            readelf -S arch/arm64/boot/Image | grep -i btf || echo "WARN: no BTF section found"
          fi

      - name: Make boot.img
        run: |
          MKB=""
          for p in $(command -v mkbootimg 2>/dev/null) /usr/bin/mkbootimg; do [ -n "$MKB" ] || MKB="$p"; done
          if [ -z "$MKB" ]; then
            echo "mkbootimg not found, trying android tools"
            sudo apt-get install -y android-libtools || true
            MKB=$(command -v mkbootimg 2>/dev/null || true)
          fi
          if [ -z "$MKB" ]; then
            echo "FATAL: cannot find mkbootimg"
            exit 1
          fi
          "$MKB" --kernel arch/arm64/boot/Image \
            --cmdline "${CMDLINE}" \
            --os_version 12 --os_patch_level 4 \
            -o boot.img
          ls -lh boot.img

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: star-btf
          path: |
            arch/arm64/boot/Image
            boot.img
